<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <h1>Hotel Feedback Form</h1>
    </header>
    <main>
        <form action="233545993831" method="post">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Name(required):</label>
                <input type="text" id="name" required placeholder="Isaac Asumadu" name="name">
                <label for="age">Age: </label>
                <input type="number" id="age" min="10" max="100">
                <label for="email">Email(required): </label>
                <input type="email" id="email" required placeholder="ikegraphix038@gmail.com" name="email">
            </fieldset>

            <fieldset>
                <legend>Was this your first time at our hotel</legend>
                <input type="radio" id="yes-option" name="hotel-stay" value="yes-option">
                <label for="yes-option">Yes</label>
                <input type="radio" id="no-option" name="hotel-stay" value="no-option">
                <label for="no-option">No</label>
            </fieldset>

            <fieldset>
                <legend>Why did yo choose our hotel(Chech all that apply)</legend>
                <input type="checkbox" id="ads" name="ads" value="ads">
                <label for="ads">Social media Ads</label>
                <input type="checkbox" id="recommendation" name="recommendation" value="recommendation" >
                <label for="recommendation">Personal Recommendation</label>
                <input type="checkbox" id="location" name="location" value="location">
                <label for="location">Location</label>
                <input type="checkbox" id="reputation"  checked name="reputation" value="reputation">
                <label for="reputation">Reputation</label>
                <input type="checkbox" id="price" name="price" value="price">
                <label for="price">Price</label>
            </fieldset>

            <fieldset>
                <legend>Ranking</legend>
                <label for="service">How the service?</label>
                <select name="service" id="service">
                    <option value="poor">Poor</option>
                    <option value="satisfactory">Satisfactory</option>
                    <option value="good">Good</option>
                    <option value="very-good">Very Good</option>
                    <option value="excellent" selected>Excellent</option>
                </select>

                <label for="food">How wa the food?</label>
                <select name="food" id="food">
                    
                </select>
            </fieldset>
        </form>
    </main>
</body>
</html>
